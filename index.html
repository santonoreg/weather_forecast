<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeFo · Weather model comparison</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23f5b301'/%3E%3C/svg%3E">
<script>try{var th=localStorage.getItem("wefo.theme");if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=greek">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=20261049">
</head>
<body>
<header class="topbar">
  <div class="brand"><span id="brandIcon"></span> WeFo <small data-i18n="brand.sub">weather model comparison</small></div>
  <div class="topright">
    <nav>
      <button class="nav-btn active" data-view="forecast" data-i18n="nav.forecast">Forecast</button>
      <button class="nav-btn" data-view="places" data-i18n="nav.places">Locations &amp; Map</button>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" class="active">EN</button><button data-lang="el">ΕΛ</button>
    </div>
    <button id="themeBtn" class="themebtn" type="button" data-i18n-title="theme.title" title="Switch light / dark theme" aria-label="Switch light / dark theme">
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- ============ FORECAST ============ -->
  <section id="view-forecast" class="view active">
    <div class="toolbar">
      <label><span data-i18n="tb.location">Location</span>
        <select id="locSelect"></select>
      </label>
      <label><span data-i18n="tb.step">Step</span>
        <select id="stepSelect">
          <option value="1" data-i18n="step.1" selected>1 hour</option>
          <option value="3" data-i18n="step.3">3 hours</option>
          <option value="6" data-i18n="step.6">6 hours</option>
          <option value="12" data-i18n="step.12">12 hours</option>
        </select>
      </label>
      <div class="fld">
        <span class="lbl" data-i18n="tb.models">Models</span>
        <details class="models" id="models">
          <summary><span id="mdlCount">–</span></summary>
          <div class="mdl-panel" id="mdlList"></div>
        </details>
      </div>
      <label class="chk"><input type="checkbox" id="weightChk" checked> <span data-i18n="tb.weight">Weight by reliability</span> <span id="vfStatus"></span></label>
      <button id="refreshBtn" class="btn ghost" data-i18n="tb.refresh" data-i18n-title="tb.refresh.title" title="Fetch fresh data">↻ Refresh</button>
      <span id="meta" class="meta"></span>
    </div>

    <div id="empty" class="notice" data-i18n-html="empty.html" hidden></div>
    <div id="error" class="notice error" hidden></div>
    <div id="loading" class="loading" hidden><div class="spinner"></div> <span data-i18n="loading">Fetching forecasts from all providers…</span></div>

    <div id="forecastBody" hidden>
      <div class="topgrid">
        <div class="toprow">
          <section id="hero" class="hero card">
            <div id="heroNow" class="now"></div>
            <div id="heroVerdict" class="verdict"></div>
            <div id="heroObs" class="obsline" hidden></div>
            <div id="heroRadar" class="rainline" hidden></div>
            <div id="heroRain" class="rainline" hidden></div>
            <div class="hero-foot">
              <button id="heroHist" type="button" class="hist">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg>
                <span data-i18n="hero.history">View full history</span>
              </button>
            </div>
          </section>
          <section class="week card">
            <div class="sec-h"><h2 data-i18n="wk.title">Days ahead</h2></div>
            <div class="wk-h" aria-hidden="true"><span data-i18n="wk.day">Day</span><span></span><span data-i18n="wk.hilo">High / low</span><span data-i18n="wk.rain">Rain</span><span data-i18n="wk.gust">Gust km/h</span></div>
            <div id="days" class="days"></div>
          </section>
        </div>
        <section class="hours card">
          <div class="hours-h">
            <h2 id="hoursTitle"><span data-i18n="hrs.title">Hour by hour</span> <small data-i18n="hrs.sub">from now</small></h2>
            <div class="seg" id="orientSeg" role="group" aria-label="Table orientation">
              <button type="button" data-orient="h" data-i18n="orient.h">→ Time across</button>
              <button type="button" data-orient="v" data-i18n="orient.v">↓ Time down</button>
              <button type="button" data-orient="m" data-i18n="orient.m">〰 Meteogram</button>
            </div>
          </div>
          <div class="tabsrow">
            <div id="tabs" class="tabs"></div>
          </div>
          <div id="segKey" class="segkey" hidden></div>
          <div id="relNote" class="relnote" hidden></div>
          <div class="table-wrap"><table id="grid" class="grid"></table><div id="meteo" class="meteo" hidden></div></div>
          <div id="vFooter" class="vfooter" hidden></div>
          <button id="modelsToggle" class="btn ghost small toggle" type="button" hidden></button>
          <div id="legend" class="legend"></div>
          <details class="expert" id="expert"><summary data-i18n="ex.title">See what the models say</summary><div id="expertBody"></div></details>
        </section>
      </div>
    </div>
  </section>

  <!-- ============ LOCATIONS ============ -->
  <section id="view-places" class="view">
    <div class="places-layout">
      <div class="panel">
        <h2 data-i18n="pl.pick">Select an area</h2>
        <div class="search">
          <input id="searchInput" type="search" data-i18n-ph="pl.search" placeholder="Search for a city or area…" autocomplete="off">
          <ul id="searchResults" class="results" hidden></ul>
        </div>
        <div class="coords">
          <label><span data-i18n="pl.lat">Latitude</span><input id="latInput" type="number" step="0.0001" min="-90" max="90" placeholder="37.9838"></label>
          <label><span data-i18n="pl.lon">Longitude</span><input id="lonInput" type="number" step="0.0001" min="-180" max="180" placeholder="23.7275"></label>
        </div>
        <label class="full"><span data-i18n="pl.name">Location name</span>
          <input id="nameInput" type="text" maxlength="120" data-i18n-ph="pl.name.ph" placeholder="e.g. Athens">
        </label>
        <div class="row">
          <button id="saveBtn" class="btn primary" data-i18n="pl.save">Save location</button>
          <button id="geoBtn" class="btn ghost" data-i18n="pl.geo">My location</button>
        </div>
        <p id="placeMsg" class="hint" data-i18n="pl.hint">Click on the map, enter coordinates or search for an area.</p>

        <h2 data-i18n="pl.saved">Saved locations</h2>
        <ul id="savedList" class="saved"></ul>
      </div>
      <div id="map" class="map"></div>
    </div>

    <!-- History of the selected saved location (shown below the map only when chosen) -->
    <section id="histSec" class="histsec" hidden>
      <button id="histClose" class="h-close" type="button" data-i18n-title="h.close" title="Close">✕</button>
      <div id="histBody"></div>
    </section>
  </section>
</main>

<footer data-i18n-html="footer.html"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/i18n.js?v=20261049"></script>
<script src="js/icons.js?v=20261049"></script>
<script src="js/app.js?v=20261049"></script>
</body>
</html>
